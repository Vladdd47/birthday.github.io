<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днем рождения!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; /* Нежно-розовый фон */
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .photo-container {
            width: 320px;
            height: 420px;
            border: 12px solid white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            margin-bottom: 30px;
            background-color: #fff;
            transform: rotate(-2deg);
        }
        
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            color: #d81b60;
            font-size: 3.5rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 0;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="photo-container">
        <!-- Вставьте ссылку на фото вместо URL_ВАШЕЙ_ФОТОГРАФИИ -->
        <img src="URL_ВАШЕЙ_ФОТОГРАФИИ" alt="Фотография">
    </div>
    
    <h1>С днем рождения!</h1>

    <!-- Библиотека для анимации конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Запуск конфетти сразу после загрузки страницы
        window.onload = function() {
            var duration = 4000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Хлопушки с двух сторон
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        };
    </script>
</body>
</html>
